site_name: Dockge for Mere Mortals
site_description: A web manager for Docker Compose stacks that keeps every stack as a plain compose.yaml file on disk. Installing Dockge, creating the first admin account, writing and validating stacks in its editor, converting docker run lines into services, and the honest line between what Dockge does and what the Docker daemon does, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/dockge-for-mere-mortals/
